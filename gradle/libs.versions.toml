[versions]
agp = "8.5.0"
kotlin = "1.9.24"
compileSdk = "34"
minSdk = "23"
targetSdk = "34"
ndkVersion = "26.1.10909125"
composeBom = "2024.06.00"
activityCompose = "1.9.0"
lifecycle = "2.7.0"
datastore = "1.1.1"
coroutines = "1.7.3"
material3 = "1.2.1"
junit = "4.13.2"
espresso = "3.5.1"
coreTesting = "1.5.0"
truth = "1.1.3"
webrtc = "125.6422.07"

[libraries]
# Android Gradle Plugin
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# AndroidX Core
coreKtx = { module = "androidx.core:core-ktx", version = "1.13.1" }
appcompat = { module = "androidx.appcompat:appcompat", version = "1.6.1" }

# Compose (using BOM)
composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeUi = { module = "androidx.compose.ui:ui" }
composeMaterial3 = { module = "androidx.compose.material3:material3" }
composeActivity = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
composeViewModel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
composeRuntime = { module = "androidx.compose.runtime:runtime" }
composeFoundation = { module = "androidx.compose.foundation:foundation" }

# Lifecycle & ViewModel
lifecycleViewModel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycleRuntime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }

# DataStore
datastorePreferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Coroutines
coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# NetherNet (WebRTC) para clientes Bedrock 26.50+
webrtc = { module = "io.github.webrtc-sdk:android", version.ref = "webrtc" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
espressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
coreTesting = { module = "androidx.test:core", version.ref = "coreTesting" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
